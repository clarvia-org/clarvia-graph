# Public-safe example of the production environment for the Lex email service.
#
# This file contains NO secrets and is safe to commit. Real secret values
# (OPENAI_API_KEY, HMAC_SECRET) are provided exclusively through Cloud Run
# Secret Manager references at deploy time, never in an env file.
#
# All Lex resources run in europe-west1 only.

ENVIRONMENT: production
ADAPTER_BACKEND: gcp
GCP_PROJECT_ID: fleet-garage-502110-g6
GCP_REGION: europe-west1
LEX_MAILBOX: lex@clarvia.org
OPENAI_MODEL: gpt-6-luna
PROMPT_VERSION: lex-v1
SCHEMA_VERSION: lex_response_v1
LEX_PROMPT_PATH: /app/runtime-private/prompts/lex-prompt.txt
PIPELINE_VERSION: single-pass-v1
MAX_OUTPUT_TOKENS: 12000
PROCESSING_MODE: disabled
PROCESSING_ENABLED: false

# Phase 7 allowlist pilot (set via deploy or set-processing-mode.sh after smoke):
# PROCESSING_MODE: allowlist
# PROCESSING_ENABLED: true
# ALLOWLIST_SENDERS: pilot1@example.com,pilot2@example.com
# ALLOWLIST_SENDER_HMACS: "<comma-separated sender HMACs>"

# Kill switch without image rebuild:
# PROCESSING_ENABLED: false
# PROCESSING_MODE: disabled
GLOBAL_DAILY_LLM_LIMIT: 500
FORCE_CIRCUIT_OPEN: false
RETENTION_TRASH_GMAIL: false
MAX_VISIBLE_RECIPIENTS: 10
MAX_SENDER_REQUESTS_PER_DAY: 5
MAX_THREAD_LEX_REPLIES: 5
LEX_INCLUDE_THREAD_QUOTE: 'true'
MAX_BODY_CHARS: 100000
MAX_THREAD_CHARS: 120000
LOG_LEVEL: INFO

# Secrets (provided via --set-secrets, NOT here):
#   OPENAI_API_KEY           -> lex-openai-api-key:latest
#   HMAC_SECRET              -> lex-hmac-secret:latest
#   LEX_WEBSITE_HMAC_SECRET  -> lex-website-hmac-secret:latest
