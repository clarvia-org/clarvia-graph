name: Validate lex email service

on:
  pull_request:
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"
  push:
    branches: [main]
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test services/lex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install and test
        run: |
          uv sync --extra dev
          uv run pytest
