name: Validate lex

on:
  pull_request:
    paths:
      - "lex/**"
      - ".github/workflows/validate-lex.yml"
  push:
    branches: [main]
    paths:
      - "lex/**"
      - ".github/workflows/validate-lex.yml"

permissions:
  contents: read

jobs:
  ci:
    name: Validate lex/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: for file in countries/*/adapter.py; do if [ -f "$file" ]; then uv run mypy "$file"; fi; done
      - run: uv run pytest --cov=lex --cov-report=term-missing
      - run: uv run lex check
      - run: uv run python scripts/check_internal_links.py
      - run: uv run python scripts/repo_size_report.py
      - run: uv build
