# Grouped monthly dependency updates.
# Each ecosystem produces one PR per month instead of one PR per package.
# Security alerts remain active via GitHub Settings (separate from this file).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TS 7.0; remove when TS 7.1 lands
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]

  - package-ecosystem: "pip"
    directory: "/services/lex"
    schedule:
      interval: "monthly"
    groups:
      all-pip:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]
