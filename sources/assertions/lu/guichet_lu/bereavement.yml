assertions:
  - id: assertion.guichet_lu.bereavement.death_must_be_declared
    schema_version: "0.1.0"
    claim_type: legal_scope
    claim_text: >
      When a death occurs in Luxembourg, it must be declared to the civil
      registrar's office in the commune where it occurred.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: death_registration
    anchor:
      selector_type: text_quote
      text_quote: "declared within 24 hours to the civil registrar's office"
    source_tier: official_guidance
    record_valid_from: "2026-06-03"
    review_status: approved
    confidence: medium
    provenance:
      extraction_method: ai_assisted
      extracted_at: "2026-06-03T12:00:00Z"

  - id: assertion.guichet_lu.bereavement.declaration_within_24h
    schema_version: "0.1.0"
    claim_type: deadline
    claim_text: >
      The death declaration must be made within 24 hours of the death.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: death_registration
    anchor:
      selector_type: text_quote
      text_quote: "within 24 hours"
    extracted_value:
      duration: "PT24H"
      starts_from: date_of_death
    source_tier: official_guidance
    record_valid_from: "2026-06-03"
    review_status: approved
    confidence: medium
    provenance:
      extraction_method: ai_assisted
      extracted_at: "2026-06-03T12:00:00Z"

  - id: assertion.guichet_lu.bereavement.survivor_pension_available
    schema_version: "0.1.0"
    claim_type: eligibility_condition
    claim_text: >
      The surviving spouse may be entitled to a survivor pension (pension de survie)
      if the deceased was insured with the Luxembourg pension system.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: survivor_pension
    anchor:
      selector_type: text_quote
      text_quote: "survivor's pension"
    source_tier: official_guidance
    record_valid_from: "2026-06-03"
    review_status: approved
    confidence: medium
    provenance:
      extraction_method: ai_assisted
      extracted_at: "2026-06-03T12:00:00Z"

  - id: assertion.guichet_lu.bereavement.who_may_declare
    schema_version: "0.1.0"
    claim_type: procedural_step
    claim_text: >
      The death declaration can be carried out by a member of the deceased's
      family, the funeral home appointed by the family, or any other person
      authorised to do so.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: death_registration
    anchor:
      selector_type: text_quote
      text_quote: "funeral home appointed by the family"
    source_tier: official_guidance
    record_valid_from: "2026-08-25"
    review_status: approved
    confidence: high
    provenance:
      extraction_method: manual
      extracted_at: "2026-08-25T12:00:00Z"

  - id: assertion.guichet_lu.bereavement.declarant_identity_required
    schema_version: "0.1.0"
    claim_type: document_required
    claim_text: >
      The person making the declaration of death must present a valid identity
      document.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: death_registration
    anchor:
      selector_type: text_quote
      text_quote: "a valid identity document"
    source_tier: official_guidance
    record_valid_from: "2026-08-25"
    review_status: approved
    confidence: high
    provenance:
      extraction_method: manual
      extracted_at: "2026-08-25T12:00:00Z"

  - id: assertion.guichet_lu.bereavement.medical_certificate_required
    schema_version: "0.1.0"
    claim_type: document_required
    claim_text: >
      The person making the declaration of death must present the medical
      certificate attesting to the death.
    claim_scope:
      jurisdiction: LU
      life_event: bereavement
      domain: death_registration
    anchor:
      selector_type: text_quote
      text_quote: "medical certificate attesting"
    source_tier: official_guidance
