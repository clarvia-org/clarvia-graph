name: Release Web Export

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web export
        run: pnpm export-web

      - name: Package export artifact
        run: |
          cd build/exports/web
          tar -czf ../../../clarvia-web-export-${{ github.event.release.tag_name }}.tar.gz .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: clarvia-web-export-${{ github.event.release.tag_name }}.tar.gz

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            clarvia-web-export-${{ github.event.release.tag_name }}.tar.gz \
            --clobber
