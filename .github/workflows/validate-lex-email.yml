name: Validate lex email service

on:
  pull_request:
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"
  push:
    branches: [main]
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test services/lex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022f16d89937 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install and test
        run: |
          uv sync --extra dev
          uv run pytest
