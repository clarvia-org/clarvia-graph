name: Validate lex email service

on:
  pull_request:
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"
  push:
    branches: [main]
    paths:
      - "services/lex/**"
      - ".github/workflows/validate-lex-email.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test services/lex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install and test
        run: |
          uv sync --extra dev
          uv run pytest
