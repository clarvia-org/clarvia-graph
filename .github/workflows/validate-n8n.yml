name: Validate n8n workflows

on:
  pull_request:
    paths:
      - "apps/web/automation/workflows/**"
      - "apps/web/automation/scripts/validate-workflows.ts"
      - ".github/workflows/validate-n8n.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/automation/workflows/**"
      - "apps/web/automation/scripts/validate-workflows.ts"
      - ".github/workflows/validate-n8n.yml"

permissions:
  contents: read

jobs:
  validate-n8n-workflows:
    name: Validate n8n workflow JSON
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workflows
        run: pnpm --filter @clarvia/workflow-web exec tsx automation/scripts/validate-workflows.ts
