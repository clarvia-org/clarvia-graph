name: Validate lex

on:
  pull_request:
    paths:
      - "lex/**"
      - ".github/workflows/validate-lex.yml"
  push:
    branches: [main]
    paths:
      - "lex/**"
      - ".github/workflows/validate-lex.yml"

permissions:
  contents: read

jobs:
  ci:
    name: Validate lex/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022f16d89937 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: for file in countries/*/adapter.py; do if [ -f "$file" ]; then uv run mypy "$file"; fi; done
      - run: uv run pytest --cov=lex --cov-report=term-missing
      - run: uv run lex check
      - run: uv run python scripts/check_internal_links.py
      - run: uv run python scripts/repo_size_report.py
      - run: uv build
