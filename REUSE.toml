version = 1

# SPDX information for the Clarvia Graph project.
# See https://reuse.software/spec/ for the REUSE specification.
#
# License model:
#   Graph code, tooling, validators, exporters     -> EUPL-1.2
#   Graph data, vocabularies, schemas              -> CC-BY-4.0
#   Documentation, exports                         -> CC-BY-4.0
#   Source assertions (original Clarvia work)      -> EUPL-1.2
#   Source snapshot metadata (YAML)                -> EUPL-1.2
#   HTML snapshots (government websites)           -> LicenseRef-Gov-PublicDomain
#   apps/web (former workflow-web)                 -> Apache-2.0
#   lex project-authored code/docs                 -> Apache-2.0
#   lex legislation corpus (official sources)      -> CC-BY-4.0 (per-country source_license)
#   services/lex (Lex email, public-safe)          -> Apache-2.0

# ── Source code (tooling, validators, exporters) ─────────────────────

[[annotations]]
path = [
  "packages/**/*.ts",
  "packages/**/*.mjs",
  "packages/**/*.json",
  "packages/**/*.snap",
]
SPDX-FileCopyrightText = "2025-2026 CLARVIA ASBL, Luxembourg"
SPDX-License-Identifier = "EUPL-1.2"

